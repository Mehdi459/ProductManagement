<style>
/* Layout: atelier d'éditeur — rail d'étapes à gauche (la chaîne du livre), plan de travail à droite, épreuve du manuscrit en colonne de lecture. */
:root {
  --paper: #f5f6f3;
  --sheet: #ffffff;
  --ink: #1b2233;
  --ink-soft: #5a6275;
  --rule: #d9dce3;
  --cloth: #23456b;      /* toile de reliure */
  --cloth-ink: #ffffff;
  --gilt: #b7862a;       /* dorure */
  --tint: #e8edf4;
  --ok: #2f7a4f;
  --warn: #a8641c;
  --bad: #b23b3b;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-text: "Literata", Georgia, "Times New Roman", serif;
  --f-ui: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #121620; --sheet: #1a1f2b; --ink: #e6e8ee; --ink-soft: #9aa2b4; --rule: #2c3343;
  --cloth: #7fa6d6; --cloth-ink: #0e1420; --gilt: #d9ab52; --tint: #222a3a;
  --ok: #6cc292; --warn: #e0a15a; --bad: #e57d7d; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #121620; --sheet: #1a1f2b; --ink: #e6e8ee; --ink-soft: #9aa2b4; --rule: #2c3343;
  --cloth: #7fa6d6; --cloth-ink: #0e1420; --gilt: #d9ab52; --tint: #222a3a;
  --ok: #6cc292; --warn: #e0a15a; --bad: #e57d7d; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--paper); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.15 }
h2 { font-size: 1.6rem } h3 { font-size: 1.1rem }
button, input, select, textarea { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--gilt); outline-offset: 2px }

.top { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; padding-block: 18px 14px; border-bottom: 1px solid var(--rule); max-width: 1240px; margin: 0 auto }
.brand { display: flex; align-items: baseline; gap: 10px }
.brand h1 { font-size: 1.5rem; letter-spacing: -.01em }
.brand span { font-family: var(--f-mono); font-size: .75rem; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .08em }
.projbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }

.shell { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 28px; max-width: 1240px; margin: 22px auto 0 }
@media (max-width: 820px) { .shell { grid-template-columns: minmax(0, 1fr); gap: 16px } }

.rail { display: flex; flex-direction: column; gap: 2px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); align-self: start }
.rail button { display: grid; grid-template-columns: 26px 1fr auto; align-items: center; gap: 8px; text-align: left; background: none; border: 0; padding: 9px 10px; border-radius: var(--r); cursor: pointer; color: var(--ink-soft) }
.rail button .n { font-family: var(--f-mono); font-size: .75rem }
.rail button .st { width: 8px; height: 8px; border-radius: 50%; background: var(--rule) }

<script>
"use strict";
/* ============================================================
   Données de référence
   ============================================================ */
const WORDS_PER_PAGE = 250;
const GENRES = {
  roman: "Roman", thriller: "Thriller / Policier", fantasy: "Fantasy / Science-fiction",
  essai: "Essai", guide: "Guide pratique / Manuel", developpement_personnel: "Développement personnel",
  business: "Business / Entrepreneuriat", jeunesse: "Livre d'histoires pour enfants",
  biographie: "Biographie / Récit de vie", cuisine: "Cuisine / Recettes"
};
const GENRE_GUIDE = {
  roman: "Narration immersive, dialogues vivants, arcs de personnages, montrer plutôt que dire.",
  thriller: "Tension constante, cliffhangers en fin de chapitre, fausses pistes, rythme rapide.",
  fantasy: "Univers cohérent (règles de magie ou de technologie), worldbuilding distillé dans l'action.",

  guide: "Pédagogique : objectifs, étapes numérotées, exemples concrets, encadrés « À retenir », exercices.",
  developpement_personnel: "Bienveillant et concret : anecdotes, exercices pratiques, plan d'action.",
  business: "Cas concrets, méthodes actionnables, chiffres présentés comme exemples s'ils ne sont pas sourcés.",
  jeunesse: "Phrases courtes, vocabulaire adapté à l'âge, humour, valeurs, scènes très visuelles.",
  biographie: "Chronologie claire, contexte historique, anecdotes, citations présentées avec prudence.",
  cuisine: "Recettes complètes (ingrédients, quantités, étapes, temps), astuces et variantes."
};
const ILLU_STYLE = {
  jeunesse: "style album jeunesse, formes rondes, couleurs vives et chaleureuses",
  roman: "style gravure ou aquarelle élégante, palette restreinte",
  thriller: "style noir graphique, contrastes forts, ombres",
  fantasy: "style épique, lumière dramatique, paysages",
  guide: "infographie ou schéma pédagogique clair avec légendes",
  essai: "illustration conceptuelle minimaliste",
  business: "infographie moderne et sobre",
  cuisine: "illustration culinaire gourmande et colorée"
};
// Prix médians de référence (€) : [ebook, broché]
const BASE_PRICES = {
  roman: [4.99, 16.90], thriller: [4.99, 17.90], fantasy: [5.99, 19.90], essai: [7.99, 19.90],
  guide: [8.99, 22.90], developpement_personnel: [6.99, 18.90], business: [9.99, 24.90],
  jeunesse: [3.99, 13.90], biographie: [6.99, 21.90], cuisine: [7.99, 24.90]
};
const UDEMY_TIERS = [19.99,24.99,29.99,34.99,39.99,44.99,49.99,54.99,59.99,64.99,69.99,74.99,79.99,84.99,89.99,94.99,99.99,109.99,119.99,129.99,139.99,149.99,159.99,179.99,199.99];

const STEPS = [
  ["marche", "Marché & tendances"], ["livre", "Plan du livre"], ["ecriture", "Écriture"],
  ["illus", "Illustrations & couvertures"], ["formation", "Formation"], ["prix", "Prix de vente"], ["exports", "Exports"]
];

/* Exemple intégré (lecture seule) pour montrer le résultat avant le premier projet. */
const EXAMPLE = {
  id: "exemple", example: true, titre: "Le Jardin des Étoiles", sous_titre: "Une histoire pour rêver avant de dormir",
  genre: "jeunesse", sujet: "Une petite fille découvre qu'elle peut faire pousser des étoiles dans le jardin de sa grand-mère.",
  public: "enfants de 5 à 8 ans", pages: 40, auteur: "Auteur", ton: "tendre et drôle", illustre: true,
  bible: "Lina, 7 ans, curieuse et têtue. Mamie Rose, jardinière qui parle aux plantes. Pistache, un hérisson bavard. Règle magique : une étoile pousse quand on arrose une graine avec un vœu sincère.",
  chapitres: [
    { titre: "La graine qui brillait", resume: "Lina trouve une graine lumineuse dans la poche du tablier de Mamie Rose.", illus: "Lina tient une graine qui brille dans la nuit, Mamie Rose sourit à la fenêtre.",
      sections: [{ titre: "Le tablier aux mille poches", resume: "Découverte de la graine.", texte: "Ce soir-là, Lina n'arrivait pas à dormir. Le vent faisait danser les rideaux et, dans la cuisine, le tablier de Mamie Rose pendait au crochet comme un drapeau fatigué.\n\nLina glissa la main dans la plus petite des poches. Ses doigts touchèrent quelque chose de rond, de tiède… et de **lumineux**." },
                 { titre: "Un vœu tout bas", resume: "Lina plante la graine et fait un vœu.", texte: "" }] },
    { titre: "Pistache mène l'enquête", resume: "Le hérisson remarque une lueur sous les fraisiers.", illus: "Un hérisson avec une loupe devant une pousse lumineuse.",
      sections: [{ titre: "Une lueur sous les fraisiers", resume: "", texte: "" }, { titre: "Le secret de Mamie Rose", resume: "", texte: "" }] }
  ],
  cover: "", arts: {}, quatrieme: "", course: null, market: null
};

/* ============================================================
   État
   ============================================================ */
const S = {
  sample: null, db: null, downloads: null, uid: null,
  books: [],           // [{id, titre}]
  book: EXAMPLE,       // projet ouvert
  view: "livre",
  run: null,           // {label, done, total, ctl, live}
  msg: null,           // {kind, text}
  market: null,        // dernière étude (si aucun livre)
  busy: {}
};
try { const v = localStorage.getItem("bf:view"); if (v && STEPS.some(s => s[0] === v)) S.view = v; } catch {}

/* ============================================================
   Utilitaires
   ============================================================ */
const $ = (sel, root = document) => root.querySelector(sel);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = n => Number(n || 0).toLocaleString("fr-FR");
const eur = n => Number(n || 0).toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const slug = t => (t || "livre").normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 50) || "livre";

/* Markdown minimal → XHTML sûr (texte échappé d'abord). */
function md(src) {
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/(^|[^*])\*(?!\s)(.+?)\*/g, "$1<em>$2</em>");
  const out = []; let list = null;
  const close = () => { if (list) { out.push(`</${list}>`); list = null; } };
  for (const raw of String(src || "").split(/\n{1,}/)) {
    const l = raw.trim();
    if (!l) { close(); continue; }
    let m;
    if ((m = l.match(/^#{1,6}\s+(.*)/))) { close(); out.push(`<h3>${inline(m[1])}</h3>`); }
    else if ((m = l.match(/^[-*•]\s+(.*)/))) { if (list !== "ul") { close(); out.push("<ul>"); list = "ul"; } out.push(`<li>${inline(m[1])}</li>`); }
    else if ((m = l.match(/^\d+[.)]\s+(.*)/))) { if (list !== "ol") { close(); out.push("<ol>"); list = "ol"; } out.push(`<li>${inline(m[1])}</li>`); }
    else if (/^(-{3,}|\*{3,})$/.test(l)) { close(); out.push('<p style="text-align:center;text-indent:0">⁂</p>'); }
    else { close(); out.push(`<p>${inline(l)}</p>`); }
  }
  close();
  return out.join("\n");
}

/* SVG : extraction + nettoyage (aucun script, aucun lien externe). */
function cleanSvg(text) {
  const m = String(text || "").match(/<svg[\s\S]*?<\/svg>/i);
  if (!m) throw { code: "no_svg", message: "La réponse ne contenait pas de SVG." };
  const doc = new DOMParser().parseFromString(m[0], "image/svg+xml");
  const svg = doc.documentElement;
  if (!svg || svg.nodeName.toLowerCase() !== "svg" || doc.querySelector("parsererror")) throw { code: "no_svg", message: "SVG illisible." };
  svg.querySelectorAll("script, foreignObject, iframe, image, use[href^='http'], a").forEach(n => n.remove());
  const walk = el => {
    for (const a of [...el.attributes]) {
      const n = a.name.toLowerCase(), v = a.value.trim().toLowerCase();
      if (n.startsWith("on") || ((n === "href" || n === "xlink:href") && !v.startsWith("#")) || v.startsWith("javascript:")) el.removeAttribute(a.name);
    }
    [...el.children].forEach(walk);
  };
  walk(svg);
  if (!svg.getAttribute("xmlns")) svg.setAttribute("xmlns", "http://www.w3.org/2000/svg");
  return new XMLSerializer().serializeToString(svg);
}
const svgImg = (svg, alt) => svg ? `<img alt="${esc(alt)}" src="data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}">` : "";

/* Statistiques */
const sectionWords = s => (s.texte || "").split(/\s+/).filter(Boolean).length;
const bookWords = b => b.chapitres.reduce((a, c) => a + c.sections.reduce((x, s) => x + sectionWords(s), 0), 0);
const bookPages = b => Math.round(bookWords(b) / WORDS_PER_PAGE) + (b.illustre ? b.chapitres.filter((c, i) => b.arts?.["c" + i]).length : 0) + 6;
const sectionsTotal = b => b.chapitres.reduce((a, c) => a + c.sections.length, 0);
const sectionsDone = b => b.chapitres.reduce((a, c) => a + c.sections.filter(s => s.texte).length, 0);

function planStructure(pages) {
  const chap = Math.max(6, Math.min(40, Math.round(pages / 12)));
  const sec = Math.max(1, Math.ceil(pages * WORDS_PER_PAGE / chap / 1800));
  return [chap, sec];
}

/* ============================================================
   Prix (barèmes indicatifs KDP / Udemy, à vérifier)
   ============================================================ */
const psych = (p, end = 0.99) => Math.max(end, Math.floor(p) + end);
const printCost = (pages, color) => +((color ? 0.75 + 0.045 * Math.max(24, pages) : 0.75 + 0.012 * Math.max(24, pages))).toFixed(2);
function marketMedian(m, key) { const v = Number(m?.prix_constates?.[key]?.median); return v > 0 ? v : null; }
function computePrices(b) {
  const pages = bookWords(b) ? bookPages(b) : Number(b.pages);
  const color = b.illustre && b.genre === "jeunesse";
  let [e0, p0] = BASE_PRICES[b.genre] || [5.99, 18.90];
  e0 = marketMedian(b.market, "ebook") || e0; p0 = marketMedian(b.market, "broche") || p0;
  const f = Math.max(0.75, Math.min(1.5, Math.pow(pages / 250, 0.35)));
  const ebook = Math.min(9.99, Math.max(2.99, psych(e0 * f)));
  const royE = +(ebook / 1.055 * 0.70 - 0.12 * 2).toFixed(2);
  const cost = printCost(pages, color);
  const broche = psych(Math.max(p0 * f, cost / 0.6 * 1.6), 0.90);
  const royP = +(broche / 1.055 * 0.60 - cost).toFixed(2);
  const minutes = Number(b.course?.udemy?.duree_totale_min || 0), h = minutes / 60;
  let target = h < 1 ? 29.99 : h < 3 ? 49.99 : h < 6 ? 89.99 : 129.99;
  const mu = marketMedian(b.market, "formation_udemy"); if (mu) target = (target + mu) / 2;
  const udemy = UDEMY_TIERS.reduce((a, t) => Math.abs(t - target) < Math.abs(a - target) ? t : a, UDEMY_TIERS[0]);
  const prices = { pages, color, ebook, royE, broche, cost, royP, udemy, udemyMkt: +(udemy * 0.37).toFixed(2), udemyCoupon: +(udemy * 0.97).toFixed(2), minutes };
  prices.scenarios = [["Prudent", 20], ["Moyen", 100], ["Succès", 500]].map(([name, n]) => ({
    name, ebook: n, broche: Math.floor(n / 3), udemy: Math.floor(n / 5),
    total: +(n * royE + Math.floor(n / 3) * royP + Math.floor(n / 5) * prices.udemyMkt * 0.4).toFixed(2)
  }));
  return prices;
}

/* ============================================================
   Stockage : base partagée de l'artifact (dossier privé du lecteur),
   avec repli navigateur si elle n'est pas disponible.
   ============================================================ */
const mem = new Map();
const Store = {
  col() { return S.db && S.uid ? S.db.collection("data/users/" + S.uid) : null; },
  async put(id, data) {
    mem.set(id, data);
    const c = this.col();
    if (c) { await c.doc(id).set(data); return; }
    try { localStorage.setItem("bf:" + id, JSON.stringify(data)); } catch {}
  },
  async del(id) {
    mem.delete(id);
    const c = this.col();
    if (c) { await c.doc(id).delete(); return; }
    try { localStorage.removeItem("bf:" + id); } catch {}
  },
  async query(field, value) {
    const c = this.col();
    if (c) { const snap = await c.where(field, "==", value).limit(1000).get(); return snap.docs.map(d => ({ id: d.id, ...d.data() })); }
    const out = [];
    try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith("bf:")) { const v = JSON.parse(localStorage.getItem(k)); if (v?.[field] === value) out.push({ id: k.slice(3), ...v }); } } } catch {}
    if (!out.length) for (const [id, v] of mem) if (v[field] === value) out.push({ id, ...v });
    return out;
  }
};

async function loadBooks() {
  try { S.books = (await Store.query("kind", "book")).sort((a, b) => (b.updated || 0) - (a.updated || 0)).map(d => ({ id: d.book, titre: d.titre })); }
  catch (e) { S.books = []; flash("err", "Impossible de lire vos projets enregistrés (" + (e.code || "erreur") + ")."); }

async function openBook(id) {
  if (id === "exemple") { S.book = EXAMPLE; render(); return; }
  const docs = await Store.query("book", id);
  const meta = docs.find(d => d.kind === "book");
  if (!meta) { flash("err", "Projet introuvable."); return; }
  const b = { id, titre: meta.titre, sous_titre: meta.sous_titre, genre: meta.genre, sujet: meta.sujet, public: meta.public, pages: meta.pages,
    auteur: meta.auteur, ton: meta.ton, illustre: meta.illustre, bible: meta.bible, quatrieme: meta.quatrieme, market: meta.market,
    chapitres: (meta.plan || []).map(c => ({ ...c, sections: c.sections.map(s => ({ ...s, texte: "" })) })), cover: "", arts: {}, course: null };
  for (const d of docs) {

  S.book = b;
  try { localStorage.setItem("bf:last", id); } catch {}
  render();
}
async function deleteBook(b) {
  const docs = await Store.query("book", b.id);
  for (const d of docs) await Store.del(d.id);
  await loadBooks();
  S.book = EXAMPLE; render();
}

async function runQueue(label, jobs) {
  if (!needSample() || S.run) return;
  const ctl = new AbortController();
  S.run = { label, done: 0, total: jobs.length, ctl, live: "", current: "" };
  render();
  try {
    for (const job of jobs) {
      if (ctl.signal.aborted) break;
      S.run.current = job.label; S.run.live = ""; paintRun();
      await job.fn({ signal: ctl.signal, onText: ({ text }) => { S.run.live = text; paintLive(); } });
      S.run.done++; paintRun();
    }
    if (!ctl.signal.aborted) flash("ok", label + " : terminé.");
  } catch (e) {
    if (e?.code !== "cancelled") flash("err", errText(e));
  } finally {
    S.run = null;
    await saveMeta(S.book).catch(() => {});
    render();
  }
}
function paintRun() {
  const r = S.run, el = $("#runBox"); if (!r || !el) return;
  $("#runLabel").textContent = `${r.label} — ${r.done}/${r.total}`;
  $("#runCur").textContent = r.current;
  $("#runBar").style.width = (r.done / Math.max(1, r.total) * 100) + "%";
}
function paintLive() {
  const el = $("#runLive"); if (!el || !S.run) return;
  el.innerHTML = S.run.live ? md(S.run.live.slice(-2500)) : '<p class="muted">Claude réfléchit…</p>';
  el.scrollTop = el.scrollHeight;
}

async function guarded(key, fn) {
  if (!needSample() || S.busy[key]) return;

function bookHtml(b) {
  const css = `@page{size:152.4mm 228.6mm;margin:20mm 16mm 22mm 18mm}body{font-family:Georgia,serif;font-size:11pt;line-height:1.55;color:#111;max-width:40em;margin:auto;padding:1em}

  .fig{text-align:center;margin:1em 0 2em}.fig svg{max-width:100%;height:auto}p{text-indent:1.2em;margin:0 0 .6em;text-align:justify}.back{page-break-before:always}.back p{text-indent:0}`;
  return `<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>${esc(b.titre)}</title><style>${css}</style></head><body>
  ${b.cover ? `<div class="cover">${b.cover}</div>` : ""}

  <section><h2>Sommaire</h2><ol>${b.chapitres.map(c => `<li>${esc(c.titre)}</li>`).join("")}</ol></section>
  ${b.chapitres.map((c, i) => `<section class="ch"><h2><small>Chapitre ${i + 1}</small><br>${esc(c.titre)}</h2>${b.illustre && b.arts["c" + i] ? `<div class="fig">${b.arts["c" + i]}</div>` : ""}${c.sections.map(s => md(s.texte)).join("\n")}</section>`).join("\n")}
  ${b.quatrieme ? `<section class="back">${b.quatrieme.split(/\n+/).map(p => `<p>${esc(p)}</p>`).join("")}</section>` : ""}
  </body></html>`;
}
function bookMd(b) {
  return [`# ${b.titre}`, `*${b.sous_titre}*`, "", b.auteur, "",
    ...b.chapitres.flatMap((c, i) => [`## Chapitre ${i + 1} — ${c.titre}`, "", ...c.sections.map(s => s.texte + "\n")]),
    b.quatrieme ? "---\n\n## Quatrième de couverture\n\n" + b.quatrieme : ""].join("\n");
}
function courseMd(b) {
  const u = b.course?.udemy || {}, s = b.course?.skillshare || {};
  return [`# Formation Udemy — ${u.titre || ""}`, `*${u.sous_titre || ""}*`, "", u.description || "", "",
    "## Objectifs", ...(u.objectifs || []).map(x => "- " + x), "", "## Prérequis", ...(u.prerequis || []).map(x => "- " + x), "",
    `**Prix recommandé :** ${u.prix_recommande_eur || ""} € — durée ≈ ${u.duree_totale_min || ""} min`, "",
    ...(u.sections || []).flatMap((sec, i) => [`## Section ${i + 1} — ${sec.titre}`, ...(sec.lecons || []).flatMap(l => [`### ${l.titre} (${l.type}, ${l.duree_min} min)`, l.script ? "> " + l.script : "", ""])]),
    `# Skillshare — ${s.titre || ""}`, s.description || "", "", `**Projet de classe :** ${s.projet_de_classe || ""}`, "",
    ...(s.lecons || []).map(l => `- ${l.titre} (${l.duree_min} min) : ${l.points_cles}`), "", "# Du livre à la formation", b.course?.tunnel_de_vente || ""].join("\n");
}
function courseCsv(b) {
  const q = v => '"' + String(v ?? "").replace(/"/g, '""') + '"';
  const rows = [["section", "lecon", "type", "duree_min", "script"]];
  for (const sec of b.course?.udemy?.sections || []) for (const l of sec.lecons || []) rows.push([sec.titre, l.titre, l.type, l.duree_min, l.script]);
  return "﻿" + rows.map(r => r.map(q).join(";")).join("\r\n");
}
async function bookEpub(b) {
  if (typeof JSZip === "undefined") throw { code: "nozip" };
  const zip = new JSZip(), id = "urn:uuid:" + (crypto.randomUUID ? crypto.randomUUID() : uid());
  zip.file("mimetype", "application/epub+zip", { compression: "STORE" });
  zip.file("META-INF/container.xml", `<?xml version="1.0" encoding="UTF-8"?><container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container"><rootfiles><rootfile full-path="OEBPS/content.opf" media-type="application/oebps-package+xml"/></rootfiles></container>`);
  const page = (title, body) => `<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html><html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops" lang="fr" xml:lang="fr"><head><meta charset="UTF-8"/><title>${esc(title)}</title><link rel="stylesheet" href="style.css"/></head><body>${body}</body></html>`;
  zip.file("OEBPS/style.css", "body{font-family:serif;line-height:1.5}h1,h2{text-align:center}p{text-indent:1.2em;margin:0 0 .5em}.fig{text-align:center}.fig img{max-width:100%}.tp{text-align:center;margin-top:30%}.tp p,.back p{text-indent:0}");
  const manifest = [], spine = [];
  const add = (idr, href, type, props) => manifest.push(`<item id="${idr}" href="${href}" media-type="${type}"${props ? ` properties="${props}"` : ""}/>`);
  add("css", "style.css", "text/css");
  if (b.cover) {
    zip.file("OEBPS/images/cover.svg", b.cover); add("cover-img", "images/cover.svg", "image/svg+xml", "cover-image");
    zip.file("OEBPS/cover.xhtml", page("Couverture", `<div class="fig"><img src="images/cover.svg" alt="Couverture"/></div>`)); add("cover", "cover.xhtml", "application/xhtml+xml"); spine.push("cover");
  }
  zip.file("OEBPS/titre.xhtml", page(b.titre, `<div class="tp"><h1>${esc(b.titre)}</h1><p><em>${esc(b.sous_titre)}</em></p><p>${esc(b.auteur)}</p></div>`)); add("titre", "titre.xhtml", "application/xhtml+xml"); spine.push("titre");
  b.chapitres.forEach((c, i) => {
    let fig = "";
    if (b.illustre && b.arts["c" + i]) { zip.file(`OEBPS/images/ch${i + 1}.svg`, b.arts["c" + i]); add(`img${i + 1}`, `images/ch${i + 1}.svg`, "image/svg+xml"); fig = `<div class="fig"><img src="images/ch${i + 1}.svg" alt="${esc(c.titre)}"/></div>`; }
    zip.file(`OEBPS/ch${i + 1}.xhtml`, page(c.titre, `<h2>Chapitre ${i + 1}<br/>${esc(c.titre)}</h2>${fig}${c.sections.map(s => md(s.texte)).join("\n").replace(/<br>/g, "<br/>")}`));
    add(`ch${i + 1}`, `ch${i + 1}.xhtml`, "application/xhtml+xml"); spine.push(`ch${i + 1}`);
  });
  if (b.quatrieme) { zip.file("OEBPS/dos.xhtml", page("Quatrième de couverture", `<div class="back">${b.quatrieme.split(/\n+/).map(p => `<p>${esc(p)}</p>`).join("")}</div>`)); add("dos", "dos.xhtml", "application/xhtml+xml"); spine.push("dos"); }
  zip.file("OEBPS/nav.xhtml", page("Sommaire", `<nav epub:type="toc"><h1>Sommaire</h1><ol>${b.chapitres.map((c, i) => `<li><a href="ch${i + 1}.xhtml">${esc(c.titre)}</a></li>`).join("")}</ol></nav>`)); add("nav", "nav.xhtml", "application/xhtml+xml", "nav");
  zip.file("OEBPS/content.opf", `<?xml version="1.0" encoding="UTF-8"?><package xmlns="http://www.idpf.org/2007/opf" version="3.0" unique-identifier="bid"><metadata xmlns:dc="http://purl.org/dc/elements/1.1/"><dc:identifier id="bid">${id}</dc:identifier><dc:title>${esc(b.titre)}</dc:title><dc:creator>${esc(b.auteur)}</dc:creator><dc:language>fr</dc:language><meta property="dcterms:modified">${new Date().toISOString().slice(0, 19)}Z</meta>${b.cover ? '<meta name="cover" content="cover-img"/>' : ""}</metadata><manifest>${manifest.join("")}</manifest><spine>${spine.map(s => `<itemref idref="${s}"/>`).join("")}</spine></package>`);
  return zip.generateAsync({ type: "blob", mimetype: "application/epub+zip" });
}
async function doExport(kind) {
  const b = S.book, base = slug(b.titre);
  try {
    const files = {
      epub: async () => ({ filename: base + ".epub", data: await bookEpub(b) }),
      html: async () => ({ filename: base + ".html", data: bookHtml(b) }),
      md: async () => ({ filename: base + ".md", data: bookMd(b) }),
      cover: async () => ({ filename: base + "-couverture.svg", data: b.cover }),
      "course-md": async () => ({ filename: base + "-formation.md", data: courseMd(b) }),
      "course-csv": async () => ({ filename: base + "-programme-udemy.csv", data: courseCsv(b) })
    };
    await S.downloads.save(await files[kind]());
    flash("ok", "Fichier enregistré.");
  } catch (e) {
    if (e?.code === "declined") return;
    flash("err", e?.code === "nozip" ? "Le module EPUB n'a pas pu se charger. Rechargez la page." : "Le téléchargement a échoué (" + (e?.code || "erreur") + ").");
  }
}

/* ============================================================
   Événements
   ============================================================ */
document.addEventListener("click", async e => {
  const t = e.target.closest("button, [data-step]"); if (!t) return;
  const b = S.book;
  if (t.dataset.step) { S.view = t.dataset.step; S.msg = null; try { localStorage.setItem("bf:view", S.view); } catch {} render(); window.scrollTo(0, 0); return; }
  if (t.id === "newBtn") { S.showNew = true; S.draft = null; S.book = { ...EXAMPLE, example: false, id: "", chapitres: [] , titre: ""}; S.view = "livre"; S.msg = null; render(); return; }
  if (t.id === "cancelNew") { S.showNew = false; render(); return; }
  if (t.id === "stopBtn") { S.run?.ctl.abort(); return; }
  if (t.dataset.idea) {
    const x = ((b.market || S.market)?.idees || [])[+t.dataset.idea];
    S.draft = { titre: x.titre, genre: GENRES[x.genre] ? x.genre : "guide", sujet: [x.sous_titre, x.angle].filter(Boolean).join(" — "), public: x.public, pages: 200 };
    S.pendingMarket = b.market || S.market;
    S.showNew = true; S.book = { ...EXAMPLE, example: false, id: "", chapitres: [], titre: "" }; S.view = "livre"; render(); return;
  }
  if (t.id === "saveBible") { b.bible = $("#bible").value; await saveMeta(b).then(() => flash("ok", "Bible enregistrée."), er => flash("err", errText(er))); return; }
  if (t.id === "saveBack") { b.quatrieme = $("#backText").value; await saveMeta(b).then(() => flash("ok", "Quatrième de couverture enregistrée."), er => flash("err", errText(er))); return; }
  if (t.id === "delBook") {
    if (t.dataset.confirm) { await deleteBook(b); flash("ok", "Projet supprimé."); }
    else { t.dataset.confirm = "1"; t.textContent = "Confirmer la suppression définitive"; }
    return;
  }
  if (t.id === "writeAll") {
    const tier = $("#tier")?.value || "default";
    const jobs = [];
    b.chapitres.forEach((c, ci) => c.sections.forEach((s, si) => { if (!s.texte) jobs.push({ label: `Ch. ${ci + 1} — ${s.titre}`, fn: o => aiSection(b, ci, si, { ...o, tier }) }); }));
    runQueue("Écriture du livre", jobs); return;
  }
  if (t.dataset.write) {
    const [ci, si] = t.dataset.write.split(":").map(Number); S.openCh = ci;
    runQueue("Écriture d'une section", [{ label: `Ch. ${ci + 1} — ${b.chapitres[ci].sections[si].titre}`, fn: o => aiSection(b, ci, si, { ...o, tier: $("#tier")?.value }) }]); return;
  }
  if (t.id === "illuAll") {
    const jobs = b.chapitres.map((c, i) => ({ i, c })).filter(x => !b.arts["c" + x.i]).map(x => ({ label: `Illustration du chapitre ${x.i + 1}`, fn: o => aiIllustration(b, "c" + x.i, o) }));
    runQueue("Illustrations", jobs); return;
  }
  if (t.dataset.illu) { const i = +t.dataset.illu; guarded("il" + i, () => aiIllustration(b, "c" + i)); return; }
  if (t.id === "mkCover") { guarded("cover", () => aiIllustration(b, "cover")); return; }
  if (t.id === "mkBack") { guarded("back", () => aiBackCover(b)); return; }
  if (t.id === "mkCourse") { guarded("course", () => aiCourse(b)); return; }
  if (t.dataset.export) { doExport(t.dataset.export); return; }
});

document.addEventListener("submit", async e => {
  e.preventDefault();
  if (e.target.id === "marketForm") {
    const form = { genre: $("#mGenre").value, langue: $("#mLang").value, marche: $("#mMarket").value, mots: $("#mWords").value };
    guarded("market", async () => {
      const m = await aiMarket(form);
      S.market = m;
      if (!S.book.example && S.book.id) { S.book.market = m; await saveMeta(S.book); }
    });
  }
  if (e.target.id === "newForm") {
    const b = { id: uid(), titre: $("#nTitre").value.trim(), genre: $("#nGenre").value, pages: Math.max(20, Math.min(900, Number($("#nPages").value) || 200)),
      sujet: $("#nSujet").value.trim(), public: $("#nPublic").value.trim() || "adultes", auteur: $("#nAuteur").value.trim() || "Auteur", ton: $("#nTon").value.trim(),
      illustre: $("#nIllu").checked, bible: "", sous_titre: "", chapitres: [], cover: "", arts: {}, quatrieme: "", course: null, market: S.pendingMarket || S.market || null };
    if (!b.titre || !b.sujet) return;
    guarded("outline", async () => {
      await aiOutline(b);
      await saveMeta(b);
      S.book = b; S.showNew = false; S.draft = null; S.pendingMarket = null;
      try { localStorage.setItem("bf:last", b.id); } catch {}
      await loadBooks();
      flash("ok", "Plan créé. Relisez la bible, puis passez à l'écriture.");
    });
  }
});

document.addEventListener("change", e => {
  if (e.target.id === "projSelect") { S.msg = null; openBook(e.target.value).catch(er => flash("err", errText(er))); }
});
document.addEventListener("toggle", e => { const d = e.target; if (d.dataset?.ch !== undefined && d.open) S.openCh = +d.dataset.ch; }, true);
window.addEventListener("beforeunload", e => { if (S.run) { e.preventDefault(); e.returnValue = ""; } });

/* ============================================================
   Démarrage : la page s'affiche tout de suite, les capacités s'allument ensuite.
   ============================================================ */
render();
(async () => {
  if (!window.claude?.use) { flash("info", "Ouvrez cette page sur claude.ai pour utiliser Claude et sauvegarder vos livres."); return; }
  const [sample, downloads, db, user] = await Promise.all(["sample", "downloads", "db", "user"].map(n => window.claude.use(n).catch(() => null)));
  S.sample = sample; S.downloads = downloads;
  if (db && user) { const id = await user.id().catch(() => null); if (id) { S.db = db; S.uid = id; } }
  await loadBooks();
  let last = null; try { last = localStorage.getItem("bf:last"); } catch {}
  if (last && S.books.some(x => x.id === last)) await openBook(last).catch(() => {});
  else render();
  if (!S.sample) flash("info", "Claude n'est pas disponible dans cette vue : ouvrez la page sur claude.ai, connecté à votre compte.");
  else if (!S.db) flash("info", "Sauvegarde en ligne indisponible : vos projets seront gardés dans ce navigateur seulement.");
})();
</script>
